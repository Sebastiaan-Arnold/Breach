name: Tag version

# Tags each new version that lands on main: for every pushed commit, the version in its
# package.json gets a vX.Y.Z tag on the first commit that carries it. Pushing several versions
# at once tags each of them.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag versions from package.json
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only the commits in this push; fall back to the newest commit if that range is unknown.
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            commits=$(git rev-list --reverse "$BEFORE..HEAD")
          else
            commits=$(git rev-parse HEAD)
          fi
          tagged=""
          for c in $commits; do
            version="v$(git show "$c:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
            if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then continue; fi
            git tag -a "$version" "$c" -m "$(git log -1 --format=%s "$c")"
            tagged="$tagged $version"
          done
          if [ -z "$tagged" ]; then
            echo "No new versions to tag."
            exit 0
          fi
          for t in $tagged; do git push origin "$t"; done
          echo "Tagged:$tagged"
